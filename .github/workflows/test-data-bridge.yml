name: OpenChart Data Bridge Tests
on:
  workflow_dispatch:
  push:
    branches: [custom]
    paths:
      - 'tools/data-bridge/**'
      - '.github/workflows/test-data-bridge.yml'
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test bridge contract
        run: node --test tools/data-bridge/adapter.test.mjs
      - name: Checkout original OpenChart revision
        uses: actions/checkout@v6
        with:
          repository: therojasagency-tech/openchart
          ref: 01b0ad35f44fc886855356da1e7281b7320fbaac
          path: openchart-upstream
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install pinned OpenChart dependencies
        working-directory: openchart-upstream
        run: |
          npm install --global npm@11.11.1
          npm --prefix vendor/tea ci --ignore-scripts
          npm --prefix vendor/tea run build:package
          bun install --frozen-lockfile
      - name: Native client offline smoke test
        run: bash tools/data-bridge/run-openchart.sh openchart-upstream --smoke
